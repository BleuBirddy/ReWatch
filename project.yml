name: ReWatch

options:
  bundleIdPrefix: dev.jey
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

# libmpv (the engine inside the mpv player) plus FFmpeg, built for iOS.
# The plain "MPVKit" product is the LGPL build; "MPVKit-GPL" adds GPL-only
# parts (Samba shares etc.) and would force the whole app to be GPL.
packages:
  MPVKit:
    url: https://github.com/mpvkit/MPVKit.git
    exactVersion: 1.1.0-n9.0.2

targets:
  ReWatch:
    type: application
    # One target, two apps: iPhone/iPad, and a native Mac app. (Mac Catalyst
    # was tried first, but MPVKit's Catalyst frameworks use the iPhone
    # bundle layout, which Xcode refuses to embed in a Mac app.)
    supportedDestinations: [iOS, macOS]
    platform: auto
    sources:
      - path: ReWatch
    # Tools/ (icon generator) is not part of the app.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jey.rewatch
        TARGETED_DEVICE_FAMILY: "1,2"
        # The Mac build is sandboxed: it can only read files you pick or drop.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": ReWatch/Supporting/ReWatch-Mac.entitlements
        GENERATE_INFOPLIST_FILE: NO
        # Glowing #ADFFFF eye on #9B666B (Resources/Assets.xcassets).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: ReWatch/Supporting/Info.plist
      properties:
        CFBundleDisplayName: ReWatch
        # Where the Mac files it (Finder, Launchpad, App Store).
        LSApplicationCategoryType: public.app-category.entertainment
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        # Music (mp3/flac) keeps playing with the screen locked.
        UIBackgroundModes:
          - audio
        # "Open in ReWatch" hands over the original file, which plays where
        # it is. (Some apps still send a copy to Documents/Inbox; ReWatch
        # deletes that copy when its player closes.)
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # File types iOS and macOS don't know out of the box (or only know
        # when another player such as IINA is installed). Without these the
        # Open panel greys the files out and "Open in" doesn't offer ReWatch.
        # Where the system already declares a type, its declaration wins.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.matroska.mkv
            UTTypeDescription: Matroska Video
            UTTypeConformsTo:
              - public.movie
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - mkv
              public.mime-type:
                - video/x-matroska
          - UTTypeIdentifier: org.matroska.mka
            UTTypeDescription: Matroska Audio
            UTTypeConformsTo:
              - public.audio
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - mka
              public.mime-type:
                - audio/x-matroska
          - UTTypeIdentifier: org.webmproject.webm
            UTTypeDescription: WebM Video
            UTTypeConformsTo:
              - public.movie
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - webm
              public.mime-type:
                - video/webm
          - UTTypeIdentifier: com.adobe.flash.video
            UTTypeDescription: Flash Video
            UTTypeConformsTo:
              - public.movie
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - flv
                - f4v
              public.mime-type:
                - video/x-flv
          - UTTypeIdentifier: dev.jey.rewatch.f4f
            UTTypeDescription: Flash Video Fragment
            UTTypeConformsTo:
              - public.movie
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - f4f
          - UTTypeIdentifier: com.microsoft.windows-media-wmv
            UTTypeDescription: Windows Media Video
            UTTypeConformsTo:
              - public.movie
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - wmv
              public.mime-type:
                - video/x-ms-wmv
          - UTTypeIdentifier: com.microsoft.windows-media-wma
            UTTypeDescription: Windows Media Audio
            UTTypeConformsTo:
              - public.audio
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - wma
              public.mime-type:
                - audio/x-ms-wma
          - UTTypeIdentifier: com.microsoft.advanced-systems-format
            UTTypeDescription: Advanced Systems Format
            UTTypeConformsTo:
              - public.movie
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - asf
              public.mime-type:
                - video/x-ms-asf
          - UTTypeIdentifier: dev.jey.rewatch.divx
            UTTypeDescription: DivX Video
            UTTypeConformsTo:
              - public.movie
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - divx
              public.mime-type:
                - video/divx
          - UTTypeIdentifier: dev.jey.rewatch.mpeg-ps
            UTTypeDescription: MPEG Program Stream
            UTTypeConformsTo:
              - public.movie
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - m2p
          - UTTypeIdentifier: dev.jey.rewatch.vob
            UTTypeDescription: DVD Video Object
            UTTypeConformsTo:
              - public.movie
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - vob
          - UTTypeIdentifier: org.xiph.ogg-audio
            UTTypeDescription: Ogg Audio
            UTTypeConformsTo:
              - public.audio
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - ogg
                - opus
              public.mime-type:
                - audio/ogg
          - UTTypeIdentifier: dev.jey.rewatch.ogm
            UTTypeDescription: Ogg Video
            UTTypeConformsTo:
              - public.movie
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - ogm
        # Offers ReWatch in the share sheet / "Open in" and Finder's Open
        # With for any video or audio file and m3u playlists. Alternate rank
        # so Photos, Music and QuickTime stay the defaults. (.ps is left out
        # on purpose: the system knows it as PostScript, and ReWatch
        # shouldn't be offered for every PostScript document.)
        CFBundleDocumentTypes:
          - CFBundleTypeName: Video
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.movie
              - public.audiovisual-content
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
          - CFBundleTypeName: Playlist
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.m3u-playlist
    dependencies:
      - package: MPVKit
        product: MPVKit

schemes:
  ReWatch:
    build:
      targets:
        ReWatch: all
    run:
      config: Debug
    archive:
      config: Release
