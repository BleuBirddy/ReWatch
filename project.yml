name: ReWatch

options:
  bundleIdPrefix: dev.jey
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

# libmpv (the engine inside the mpv player) plus FFmpeg, built for iOS.
# The plain "MPVKit" product is the LGPL build; "MPVKit-GPL" adds GPL-only
# parts (Samba shares etc.) and would force the whole app to be GPL.
packages:
  MPVKit:
    url: https://github.com/mpvkit/MPVKit.git
    exactVersion: 1.1.0-n9.0.2

targets:
  ReWatch:
    type: application
    platform: iOS
    sources:
      - path: ReWatch
    # Tools/ (icon generator) is not part of the app.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jey.rewatch
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        # Glowing #ADFFFF eye on #9B666B (Resources/Assets.xcassets).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: ReWatch/Supporting/Info.plist
      properties:
        CFBundleDisplayName: ReWatch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        # Music (mp3/flac) keeps playing with the screen locked.
        UIBackgroundModes:
          - audio
        # Shows a "ReWatch" folder in the Files app, so big videos can be
        # dropped in from a Mac or another app without a copy through the
        # importer. The library is just that folder (Documents).
        UIFileSharingEnabled: true
        # iOS hands ReWatch a copy in Documents/Inbox for "Open in";
        # MediaLibrary moves it into the library.
        LSSupportsOpeningDocumentsInPlace: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iOS has no built-in type for Matroska, so ReWatch declares one.
        # Without it the file picker greys out .mkv files.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.matroska.mkv
            UTTypeDescription: Matroska Video
            UTTypeConformsTo:
              - public.movie
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - mkv
              public.mime-type:
                - video/x-matroska
        # Offers ReWatch in the share sheet / "Open in". Alternate rank so
        # Photos/Music stay the defaults for files they already handle.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Media
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.mp3
              - public.mpeg-4
              - org.xiph.flac
              - org.matroska.mkv
    dependencies:
      - package: MPVKit
        product: MPVKit

schemes:
  ReWatch:
    build:
      targets:
        ReWatch: all
    run:
      config: Debug
    archive:
      config: Release
